name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest -q
      - name: Server starts and answers --version
        run: eyalsec-mcp --version

  other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Server starts and answers --version
        run: eyalsec-mcp --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t eyalsec-mcp .
      - name: The server answers an MCP initialize and tools/list with no key set
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 docker run --rm -i eyalsec-mcp > out.jsonl || true
          cat out.jsonl
          grep -q '"search_events"' out.jsonl

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.0
      - run: ruff check .
      - run: ruff format --check .
      - name: Versions agree
        run: |
          py=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          init=$(python -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("src/eyalsec_mcp/__init__.py").read())[1])')
          sj=$(python -c 'import json;d=json.load(open("server.json"));print(d["version"], d["packages"][0]["version"])')
          echo "pyproject=$py init=$init server.json=$sj"
          test "$py" = "$init" && test "$sj" = "$py $py"
